<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Protocol — CoinFlip example (NON-PRODUCTION)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SF Pro Display', -apple-system, sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 480px; width: 100%; padding: 20px; }
        .card { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 20px; padding: 32px; border: 1px solid #333; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 4px; }
        h2 { text-align: center; font-size: 14px; color: #666; margin-bottom: 12px; }
        .banner { background: #3a1a00; color: #ffaa00; border: 1px solid #664400; border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.4; margin-bottom: 20px; }
        .balance { text-align: center; font-size: 16px; color: #aaa; margin-bottom: 16px; }
        .coin { width: 120px; height: 120px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
        .coin.flipping { animation: spin 0.6s linear infinite; }
        @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .result { text-align: center; font-size: 20px; margin-bottom: 16px; min-height: 28px; }
        .result.win { color: #00ff88; }
        .result.lose { color: #ff4466; }
        .result.pending { color: #ffaa00; }
        .buttons { display: flex; gap: 12px; margin-bottom: 16px; }
        .btn { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-heads { background: #2563eb; color: #fff; }
        .btn-tails { background: #7c3aed; color: #fff; }
        .btn-pull { background: #0f766e; color: #fff; width: 100%; margin-bottom: 16px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .bet-input, .addr-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #0a0a0f; color: #fff; font-size: 14px; margin-bottom: 12px; }
        .proof { background: #0f0f1a; border-radius: 10px; padding: 16px; font-family: monospace; font-size: 12px; color: #aaa; word-break: break-all; display: none; }
        .proof-label { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .connect { width: 100%; padding: 12px; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; color: #fff; cursor: pointer; margin-bottom: 16px; }
        .status { text-align: center; font-size: 12px; color: #666; margin-top: 16px; }
        .quote { text-align: center; font-size: 12px; color: #888; margin-bottom: 12px; min-height: 16px; }
        label { display: block; font-size: 11px; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Dice Protocol</h1>
            <h2>CoinFlip example</h2>
            <div class="banner">
                NON-PRODUCTION example. Not a live casino. Deploy your own CoinFlip on Robinhood Chain testnet (46630), paste the address, fund the bankroll, then flip. Oracle fee is separate from the wager.
            </div>

            <label>CoinFlip address (you deploy this)</label>
            <input class="addr-input" id="flipAddress" placeholder="0x… deployed CoinFlip" />

            <button class="connect" id="connectBtn">Connect Wallet</button>
            <div class="balance" id="balance"></div>
            <div class="quote" id="quote"></div>

            <div class="coin" id="coin">C</div>
            <div class="result" id="result"></div>

            <label>Wager (ETH) — oracle fee is added automatically</label>
            <input type="number" class="bet-input" id="betAmount" placeholder="Wager (ETH)" step="0.001" value="0.001" />

            <div class="buttons">
                <button class="btn btn-heads" id="headsBtn" disabled>Heads</button>
                <button class="btn btn-tails" id="tailsBtn" disabled>Tails</button>
            </div>
            <button class="btn btn-pull" id="withdrawBtn" disabled>Withdraw winnings</button>

            <div class="proof" id="proof">
                <div class="proof-label">Onchain proof</div>
                <div id="proofContent"></div>
            </div>

            <div class="status" id="status">
                Testnet only · Dice 0x43c8A7B1…A42D · chain 46630
            </div>
        </div>
    </div>

    <script type="module">
        import { BrowserProvider, Contract, formatEther, parseEther, getAddress, isAddress } from 'https://cdn.jsdelivr.net/npm/ethers@6.13.5/+esm';

        const DICE_ADDRESS = '0x43c8A7B1a85384cabf3D3Fd45a15C01F5b51A42D';
        const PROVIDER = '0x8741b8a825644D9Ef18Faf2DAB5e9b47B900F2b6';
        const RPC_URL = 'https://rpc.testnet.chain.robinhood.com/rpc';
        const CHAIN_ID = 46630;
        const CHAIN_HEX = '0xb666';

        const COIN_FLIP_ABI = [
            {"type":"function","name":"quote","stateMutability":"view","inputs":[{"name":"wager","type":"uint256"}],"outputs":[{"name":"fee","type":"uint256"},{"name":"total","type":"uint256"}]},
            {"type":"function","name":"flip","stateMutability":"payable","inputs":[{"name":"guess","type":"uint8"},{"name":"userRandom","type":"bytes32"},{"name":"wager","type":"uint256"}],"outputs":[{"name":"seq","type":"uint64"}]},
            {"type":"function","name":"getGame","stateMutability":"view","inputs":[{"name":"seq","type":"uint64"}],"outputs":[{"name":"player","type":"address"},{"name":"guess","type":"uint8"},{"name":"wager","type":"uint256"},{"name":"state","type":"uint8"},{"name":"randomNumber","type":"bytes32"}]},
            {"type":"function","name":"pendingPayouts","stateMutability":"view","inputs":[{"name":"","type":"address"}],"outputs":[{"type":"uint256"}]},
            {"type":"function","name":"houseReserve","stateMutability":"view","inputs":[],"outputs":[{"type":"uint256"}]},
            {"type":"function","name":"withdraw","stateMutability":"nonpayable","inputs":[],"outputs":[]},
            {"type":"event","name":"Flipped","inputs":[{"name":"sequence","type":"uint64","indexed":true},{"name":"player","type":"address","indexed":true},{"name":"guess","type":"uint8","indexed":false},{"name":"wager","type":"uint256","indexed":false},{"name":"fee","type":"uint256","indexed":false}]},
            {"type":"event","name":"Resolved","inputs":[{"name":"sequence","type":"uint64","indexed":true},{"name":"player","type":"address","indexed":true},{"name":"result","type":"uint8","indexed":false},{"name":"state","type":"uint8","indexed":false},{"name":"randomNumber","type":"bytes32","indexed":false}]}
        ];

        let provider, signer, account, coinFlip;

        const $ = (id) => document.getElementById(id);

        function flipAddress() {
            const raw = $('flipAddress').value.trim();
            if (!isAddress(raw)) return '';
            return getAddress(raw);
        }

        function setButtons(enabled) {
            $('headsBtn').disabled = !enabled;
            $('tailsBtn').disabled = !enabled;
            $('withdrawBtn').disabled = !enabled;
        }

        async function connect() {
            if (typeof window.ethereum === 'undefined') {
                alert('No injected wallet. This example is non-production.');
                return;
            }
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                provider = new BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                account = await signer.getAddress();
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: CHAIN_HEX }],
                    });
                } catch (e) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: CHAIN_HEX,
                            chainName: 'Robinhood Chain Testnet',
                            nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                            rpcUrls: [RPC_URL],
                            blockExplorerUrls: ['https://explorer.testnet.chain.robinhood.com'],
                        }],
                    });
                }
                $('connectBtn').textContent = account.slice(0, 6) + '...' + account.slice(-4);
                setButtons(true);
                await refresh();
            } catch (e) {
                alert('Connection failed: ' + e.message);
            }
        }

        async function bindContract() {
            const addr = flipAddress();
            if (!signer || !addr) {
                coinFlip = null;
                return null;
            }
            coinFlip = new Contract(addr, COIN_FLIP_ABI, signer);
            return coinFlip;
        }

        async function refresh() {
            if (!signer) return;
            const bal = await provider.getBalance(account);
            let extra = '';
            const c = await bindContract();
            if (c) {
                try {
                    const pending = await c.pendingPayouts(account);
                    const reserve = await c.houseReserve();
                    extra = ` · pending ${formatEther(pending)} · house ${formatEther(reserve)}`;
                    const wager = $('betAmount').value;
                    if (wager && Number(wager) > 0) {
                        const [fee, total] = await c.quote(parseEther(wager));
                        $('quote').textContent = `oracle fee ${formatEther(fee)} ETH · send ${formatEther(total)} ETH`;
                    }
                } catch (e) {
                    $('quote').textContent = 'Could not quote. Check CoinFlip address and network.';
                }
            } else {
                $('quote').textContent = 'Paste a deployed testnet CoinFlip address.';
            }
            $('balance').textContent = `Wallet: ${formatEther(bal)} ETH${extra}`;
        }

        async function waitResolved(seq) {
            const c = coinFlip;
            for (let i = 0; i < 60; i++) {
                const game = await c.getGame(seq);
                if (Number(game.state) !== 0) return game;
                await new Promise((r) => setTimeout(r, 2000));
            }
            throw new Error('Timed out waiting for reveal (~2 min). Keeper may be down.');
        }

        async function doFlip(guess) {
            const c = await bindContract();
            if (!c) {
                alert('Paste a deployed CoinFlip address first. This UI is non-production.');
                return;
            }
            const wagerStr = $('betAmount').value;
            if (!wagerStr || Number(wagerStr) <= 0) {
                alert('Enter a wager greater than 0');
                return;
            }
            const wager = parseEther(wagerStr);
            const userRandom = '0x' + Array.from(crypto.getRandomValues(new Uint8Array(32)))
                .map((b) => b.toString(16).padStart(2, '0')).join('');

            $('coin').classList.add('flipping');
            $('result').className = 'result pending';
            $('result').textContent = 'Quoting fee + wager...';
            setButtons(false);
            try {
                const [fee, total] = await c.quote(wager);
                $('quote').textContent = `oracle fee ${formatEther(fee)} ETH · send ${formatEther(total)} ETH`;
                $('result').textContent = 'Requesting randomness...';
                const tx = await c.flip(guess, userRandom, wager, { value: total });
                const receipt = await tx.wait();
                let seq = null;
                for (const log of receipt.logs) {
                    try {
                        const parsed = c.interface.parseLog(log);
                        if (parsed && parsed.name === 'Flipped') seq = parsed.args.sequence;
                    } catch {}
                }
                if (seq === null) throw new Error('No Flipped event');
                $('result').textContent = `Pending seq ${seq}. Waiting for keeper reveal...`;
                const game = await waitResolved(seq);
                const won = Number(game.state) === 1;
                $('result').className = won ? 'result win' : 'result lose';
                $('result').textContent = won
                    ? 'Won. Winnings are pull-payment — click Withdraw.'
                    : 'Lost. Wager stays in the house bankroll.';
                $('proof').style.display = 'block';
                $('proofContent').textContent =
                    `seq ${seq}\nrandom ${game.randomNumber}\nresult ${Number(game.randomNumber) & 1n ? 'Tails' : 'Heads'}`;
                await refresh();
            } catch (e) {
                $('result').className = 'result lose';
                $('result').textContent = 'Error: ' + (e.shortMessage || e.message);
            } finally {
                $('coin').classList.remove('flipping');
                setButtons(true);
            }
        }

        async function doWithdraw() {
            const c = await bindContract();
            if (!c) return;
            try {
                const tx = await c.withdraw();
                await tx.wait();
                $('result').className = 'result win';
                $('result').textContent = 'Withdrawn.';
                await refresh();
            } catch (e) {
                alert(e.shortMessage || e.message);
            }
        }

        $('connectBtn').onclick = connect;
        $('headsBtn').onclick = () => doFlip(0);
        $('tailsBtn').onclick = () => doFlip(1);
        $('withdrawBtn').onclick = doWithdraw;
        $('betAmount').onchange = refresh;
        $('flipAddress').onchange = refresh;
    </script>
</body>
</html>
