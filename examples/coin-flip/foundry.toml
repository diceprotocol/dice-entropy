[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "../../contracts/lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
allow_paths = ["../../contracts", "../../sdk"]
remappings = [
    "forge-std/=../../contracts/lib/forge-std/src/",
    "@diceprotocol/sdk/=../../sdk/",
    "@dice-protocol/=../../contracts/src/",
    "@openzeppelin/=../../contracts/lib/openzeppelin-contracts/contracts/",
    "@excessively-safe-call/=../../contracts/lib/ExcessivelySafeCall/",
]

[fmt]
line_length = 100
tab_width = 4
