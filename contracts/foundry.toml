[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
auto_detect_solc = false
auto_detect_remappings = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = false

[fmt]
line_length = 100
tab_width = 4
